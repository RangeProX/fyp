<div class="meeting-card">
  <div class="header">
    <div class="title">Upcoming<br />Events</div>
  </div>

  <div class="state-text" *ngIf="isLoading">Loading events...</div>
  <div class="state-text error" *ngIf="!isLoading && loadError">{{ loadError }}</div>
  <div class="state-text" *ngIf="!isLoading && !loadError && upcomingEvents.length === 0">No upcoming events in the next 3 days</div>

  <div class="date-nav-container" *ngIf="!isLoading && !loadError && upcomingEvents.length > 0">
    <button type="button" class="day-item" *ngFor="let event of upcomingEvents" [class.day-active]="event.isToday" (click)="openCalendarEvent(event)">
      <div class="day-number">{{ event.dayNumber }}</div>
      <div class="day-name">{{ event.dayName }}</div>
      <div class="event-title" [title]="event.title">{{ event.title }}</div>
      <div class="event-time">{{ event.timeLabel }}</div>
    </button>
  </div>
</div>
