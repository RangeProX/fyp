<div class="meeting-card bg-gradient-to-b from-white to-sky-50/30 rounded-xl shadow-sm border border-sky-100 p-6">
  <div class="header mb-4">
    <h2 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-studyBlue-700 to-indigo-600 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      Upcoming Events
    </h2>
  </div>

  <div class="state-text text-gray-500 py-4" *ngIf="isLoading">Loading events...</div>
  <div class="state-text error text-red-500 py-4" *ngIf="!isLoading && loadError">{{ loadError }}</div>
  <div class="state-text text-gray-500 py-4 bg-sky-50 border border-sky-100 rounded-lg text-center" *ngIf="!isLoading && !loadError && upcomingEvents.length === 0">No upcoming events in the next 3 days</div>

  <div class="date-nav-container max-h-96 overflow-y-auto flex flex-col gap-3 pr-2" *ngIf="!isLoading && !loadError && upcomingEvents.length > 0">
    <button type="button" class="day-item flex items-center p-3 rounded-xl border border-sky-100 bg-white hover:border-indigo-200 hover:bg-indigo-50 hover:shadow-sm transition-all text-left group" *ngFor="let event of upcomingEvents" [class.bg-indigo-50]="event.isToday" [class.border-indigo-200]="event.isToday" [class.shadow-sm]="event.isToday" (click)="openCalendarEvent(event)">
      <div class="flex-shrink-0 w-12 text-center mr-4">
        <div class="day-name text-xs font-bold text-indigo-500 uppercase tracking-wider" [class.text-indigo-600]="event.isToday">{{ event.dayName }}</div>
        <div class="day-number text-2xl font-black text-gray-800" [class.text-indigo-700]="event.isToday">{{ event.dayNumber }}</div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="event-title text-sm font-bold text-gray-800 truncate group-hover:text-indigo-700" [title]="event.title">{{ event.title }}</div>
        <div class="event-time text-xs text-indigo-600/80 font-medium mt-1">{{ event.timeLabel }}</div>
      </div>
    </button>
  </div>
</div>
