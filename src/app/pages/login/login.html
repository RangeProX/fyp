<div class="min-h-[80vh] flex items-center justify-center font-sans p-4">
    <div class="bg-white rounded-2xl shadow-md border border-indigo-50 p-8 w-full max-w-md">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-studyBlue-700 to-indigo-600 tracking-tight text-center mb-8">Log In</h1>
        
        <form (ngSubmit)="login(loginForm)" #loginForm="ngForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    [(ngModel)]="username" 
                    (ngModelChange)="onInputChange()" 
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-studyBlue-500 focus:ring-2 focus:ring-studyBlue-200 transition-all outline-none text-gray-800"
                >
            </div>
            
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <input 
                        [type]="showPassword ? 'text' : 'password'" 
                        id="password" 
                        name="password" 
                        [(ngModel)]="password" 
                        (ngModelChange)="onInputChange()" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-studyBlue-500 focus:ring-2 focus:ring-studyBlue-200 transition-all outline-none text-gray-800 pr-12"
                    >
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-studyBlue-500 transition-colors" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility" role="button">
                        <ng-container *ngIf="showPassword; else hiddenIcon">
                            <!-- open eye icon -->
                            <svg stroke="currentColor" class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
                            </svg>
                        </ng-container>
                        <ng-template #hiddenIcon>
                            <!-- closed eye icon -->
                            <svg stroke="currentColor" class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 012.64-4.362M9.88 9.88a3 3 0 104.24 4.24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M3 3l18 18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M10.73 5.08A9.97 9.97 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.132 5.411" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </ng-template>
                    </span>
                </div>
            </div>
            
            <div *ngIf="errorMessage" class="text-red-500 text-sm font-medium bg-red-50 py-2 px-3 rounded-lg text-center">
                {{ errorMessage }}
            </div>
            
            <button type="submit" [disabled]="loading" class="w-full py-3 px-6 rounded-xl font-bold text-white bg-gradient-to-r from-studyBlue-600 to-indigo-600 hover:from-studyBlue-500 hover:to-indigo-500 transition-all shadow-md hover:shadow-lg disabled:opacity-70 disabled:cursor-not-allowed mt-4">
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a routerLink="/register" class="font-semibold text-studyBlue-600 hover:text-studyBlue-500 transition-colors">Register</a>
        </div>
    </div>
</div>
