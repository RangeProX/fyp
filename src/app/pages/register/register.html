<div class="container">
    <h2>Register</h2>
    <form (ngSubmit)="register()" #registerForm="ngForm">
        <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" (ngModelChange)="onInputChange()" (blur)="onInputBlur()" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" (ngModelChange)="onInputChange()" (blur)="onInputBlur()" required>
        Password must be at least 8 characters long and include a number and a special character.
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" (ngModelChange)="onInputChange()" (blur)="onInputBlur()" required>
        <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
        </div>
        <button type="submit">Register</button>
    </form>
    <br>
    Already have an account? <a routerLink="/login">Log In</a>
</div>
